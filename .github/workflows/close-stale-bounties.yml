name: Close Stale Bounty Alerts

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  close-stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close stale bounty alert issues
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bounty-alert',
              per_page: 100
            });

            const now = Date.now();
            const maxAge = 7 * 24 * 60 * 60 * 1000;

            for (const issue of issues.data) {
              const createdAt = new Date(issue.created_at).getTime();
              const age = now - createdAt;

              if (age > maxAge) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: 'Closing stale bounty alert. Bounties are tracked in their original repositories.'
                });

                console.log(`Closed stale bounty alert #${issue.number}`);
              }
            }
