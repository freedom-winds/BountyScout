name: Bounty Scout

on:
  schedule:
    # Run hourly
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # No third‑party dependencies required for the core scanner.

      - name: Run Bounty Scout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # In a real deployment the scanner would fetch issues via the GitHub API.
          # For the purpose of this CI run we simply demonstrate the CLI by feeding
          # a static list of URLs via stdin.
          printf "https://github.com/example/repo/issues/1\nhttps://github.com/example/repo/issues/2\n" \
            | python scout_bounties.py
