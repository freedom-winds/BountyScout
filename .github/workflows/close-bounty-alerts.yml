name: Close Bounty Alert Issues

on:
  issues:
    types: [opened]

jobs:
  close-bounty-alerts:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.title, '🎯 Bounty Alert') || contains(github.event.issue.title, 'Bounty Alert')
    permissions:
      issues: write
    steps:
      - name: Close bounty alert issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 This appears to be an automated bounty alert issue. Closing automatically to keep the issue tracker clean.\n\nIf this was closed in error, please reopen manually.'
            });
