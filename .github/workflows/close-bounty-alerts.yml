name: Close Bounty Alert Issues

on:
  issues:
    types: [opened]

jobs:
  close-bounty-alerts:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.title, '🎯 Bounty Alert')
    permissions:
      issues: write
    steps:
      - name: Close bounty alert issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'This is an automated bounty scan notification and has been automatically closed. These issues are informational only and do not require action in this repository.'
            });
