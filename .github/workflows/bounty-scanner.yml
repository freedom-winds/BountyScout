name: Bounty Scanner

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Scan for bounties
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const repos = [
              'ThanhTrucSolutions/OriLang',
              'dev-kp-eloper/BountyScout'
            ];

            const bountyLabels = ['bounty', 'reward', 'prize', 'mrg'];
            const foundBounties = [];

            for (const repo of repos) {
              const [owner, repoName] = repo.split('/');
              
              try {
                const issues = await github.rest.issues.listForRepo({
                  owner,
                  repo: repoName,
                  state: 'open',
                  per_page: 50
                });

                for (const issue of issues.data) {
                  const hasLabel = issue.labels.some(label => 
                    bountyLabels.some(bl => label.name.toLowerCase().includes(bl))
                  );
                  
                  const hasKeyword = bountyLabels.some(kw => 
                    issue.title.toLowerCase().includes(kw) ||
                    (issue.body && issue.body.toLowerCase().includes(kw))
                  );

                  if (hasLabel || hasKeyword) {
                    foundBounties.push({
                      title: issue.title,
                      url: issue.html_url,
                      repo: repo,
                      comments: issue.comments,
                      updated: issue.updated_at
                    });
                  }
                }
              } catch (error) {
                console.log(`Error scanning ${repo}: ${error.message}`);
              }
            }

            if (foundBounties.length > 0) {
              let body = `### Active Bounty Scan Results\n\n`;
              body += `**Scan Time:** ${new Date().toISOString().replace('T', ' ').substring(0, 16)} UTC\n\n`;
              
              foundBounties.forEach((bounty, idx) => {
                body += `#### ${idx + 1}. [${bounty.title}](${bounty.url})\n`;
                body += `- **Repository:** [${bounty.repo}](https://github.com/${bounty.repo})\n`;
                body += `- **Comments:** ${bounty.comments}\n`;
                body += `- **Last Updated:** ${bounty.updated}\n\n`;
              });

              const existingIssues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'bounty-alert',
                per_page: 10
              });

              const recentIssue = existingIssues.data.find(issue => {
                const createdAt = new Date(issue.created_at);
                const hoursSince = (Date.now() - createdAt.getTime()) / (1000 * 60 * 60);
                return hoursSince < 24;
              });

              if (!recentIssue) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `🎯 Bounty Alert: ${foundBounties.length} New Opportunit${foundBounties.length === 1 ? 'y' : 'ies'} found`,
                  body: body,
                  labels: ['bounty-alert', 'automated']
                });
                console.log(`Created bounty alert with ${foundBounties.length} opportunities`);
              } else {
                console.log('Recent bounty alert already exists, skipping creation');
              }
            } else {
              console.log('No bounties found in this scan');
            }
