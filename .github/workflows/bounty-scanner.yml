name: Bounty Scanner

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Scan for bounties
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const query = `
              is:issue is:open label:bounty,"bug bounty","good first issue" created:>=${new Date(Date.now() - 24*60*60*1000).toISOString()}
            `;
            
            const issues = await github.rest.search.issuesAndPullRequests({
              q: query,
              sort: 'updated',
              order: 'desc',
              per_page: 10
            });
            
            if (issues.data.items.length === 0) {
              console.log('No new bounties found');
              return;
            }
            
            const scanTime = new Date().toISOString().replace('T', ' ').substring(0, 16) + ' UTC';
            let body = `### Active Bounty Scan Results\n\n**Scan Time:** ${scanTime}\n\n`;
            
            issues.data.items.forEach((issue, index) => {
              const repoFullName = issue.repository_url.replace('https://api.github.com/repos/', '');
              body += `#### ${index + 1}. [${issue.title}](${issue.html_url})\n`;
              body += `- **Repository:** [${repoFullName}](https://github.com/${repoFullName})\n`;
              body += `- **Comments:** ${issue.comments}\n`;
              body += `- **Last Updated:** ${issue.updated_at}\n\n`;
            });
            
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bounty-scan',
              per_page: 1
            });
            
            if (existingIssues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssues[0].number,
                title: `🎯 Bounty Alert: ${issues.data.items.length} New Opportunities Found`,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🎯 Bounty Alert: ${issues.data.items.length} New Opportunities Found`,
                body: body,
                labels: ['bounty-scan', 'automated']
              });
            }
